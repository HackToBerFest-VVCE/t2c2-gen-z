<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fp-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="fp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0b111e" />

  <!-- Outer Gradient Shield -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#fp-grad)" filter="url(#fp-shadow)" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="#0d1526" />

  <!-- Inner Chip Area -->
  <rect x="116" y="116" width="280" height="280" rx="48" fill="url(#fp-grad)" fill-opacity="0.12" stroke="url(#fp-grad)" stroke-width="8" />

  <!-- Center Core -->
  <rect x="176" y="176" width="160" height="160" rx="32" fill="url(#fp-grad)" />

  <!-- Core Circuit Node -->
  <circle cx="256" cy="256" r="32" fill="#0b111e" />
  <circle cx="256" cy="256" r="16" fill="url(#fp-glow)" />

  <!-- CPU Pin Connectors -->
  <!-- Top Pins -->
  <line x1="200" y1="116" x2="200" y2="76" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="116" x2="256" y2="68" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="312" y1="116" x2="312" y2="76" stroke="#34d399" stroke-width="8" stroke-linecap="round" />

  <!-- Bottom Pins -->
  <line x1="200" y1="396" x2="200" y2="436" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="396" x2="256" y2="444" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />
  <line x1="312" y1="396" x2="312" y2="436" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />

  <!-- Left Pins -->
  <line x1="116" y1="200" x2="76" y2="200" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="116" y1="256" x2="68" y2="256" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <line x1="116" y1="312" x2="76" y2="312" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />

  <!-- Right Pins -->
  <line x1="396" y1="200" x2="436" y2="200" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="396" y1="256" x2="444" y2="256" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <line x1="396" y1="312" x2="436" y2="312" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />

  <!-- Signal Wave Dots for Mesh / Field wireless -->
  <circle cx="200" cy="64" r="6" fill="#34d399" />
  <circle cx="256" cy="56" r="6" fill="#34d399" />
  <circle cx="312" cy="64" r="6" fill="#34d399" />
  <circle cx="200" cy="448" r="6" fill="#06b6d4" />
  <circle cx="256" cy="456" r="6" fill="#06b6d4" />
  <circle cx="312" cy="448" r="6" fill="#06b6d4" />
</svg>
